mode: ContinuousDelivery
# Fallback base for a history that carries no version tag. Release tags now
# supersede it, so tag every release as v<version> and builds anchor on the tag.
next-version: 1.1.0
# Only the Conventional Commit type in the subject line, a line that starts with
# BREAKING CHANGE, or a literal +semver: override raises the version above the
# branch's default increment. GitVersion matches these case-insensitively
# against the whole message, body included, so the Sampler defaults turned prose
# into releases: "major" in the review text of #25 made 6.0.0. \A anchors a
# pattern to the start of the subject; only the BREAKING CHANGE group matches at
# any line start, and only in capitals, so a body that quotes such a line counts.
major-version-bump-message: '\+semver:\s?(breaking|major)|\A\w+(\([^)]*\))?!:|(?m-i:^BREAKING[ -]CHANGE:)'
minor-version-bump-message: '\+semver:\s?(feature|minor)|\Afeat(\([^)]*\))?:'
patch-version-bump-message: '\+semver:\s?(fix|patch)|\A(fix|perf)(\([^)]*\))?:'
no-bump-message: '\+semver:\s?(none|skip)'
assembly-informational-format: '{NuGetVersionV2}+Sha.{Sha}.Date.{CommitDate}'
branches:
  main:
    tag: preview
    regex: ^main$
    source-branches: []
  pull-request:
    tag: PR
  # Both regexes are anchored. Unanchored, they match anywhere in the branch
  # name, so 'ai/fix-...' matched feature *and* hotfix; GitVersion then warns
  # about the extra match on the same stdout stream the pipeline parses as JSON.
  feature:
    tag: useBranchName
    increment: Minor
    regex: ^(f(eature(s)?)?|ai)[\/-]
    source-branches: ['main']
  hotfix:
    tag: fix
    increment: Patch
    regex: ^(hot)?fix(es)?[\/-]
    source-branches: ['main']
  # A tag push checks out refs/tags/<tag> with a detached HEAD, so GitVersion
  # takes the branch name from GITHUB_REF and works on a synthetic 'tags/<tag>'
  # branch. With no entry matching it, GitVersion tries to inherit configuration
  # from a parent branch and aborts the release build with "could not determine
  # which branch to treat as the development branch". The tag is the version, so
  # this entry adds no label and no increment.
  release-tag:
    tag: ''
    increment: None
    regex: ^tags?[-/]
    source-branches: []

ignore:
  sha: []
merge-message-formats: {}
