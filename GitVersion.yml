mode: ContinuousDelivery
# No release tag exists yet, so this is the base GitVersion increments from.
# Tag every release as v<version> so later builds anchor on the tag instead.
next-version: 1.1.0
major-version-bump-message: '(breaking\schange|breaking|major)\b'
minor-version-bump-message: '(adds?|features?|minor)\b'
patch-version-bump-message: '\s?(fix|patch)'
no-bump-message: '\+semver:\s?(none|skip)'
assembly-informational-format: '{NuGetVersionV2}+Sha.{Sha}.Date.{CommitDate}'
branches:
  main:
    tag: preview
    regex: ^main$
    source-branches: []
  pull-request:
    tag: PR
  feature:
    tag: useBranchName
    increment: Minor
    regex: (f(eature(s)?)?|ai)[\/-]
    source-branches: ['main']
  hotfix:
    tag: fix
    increment: Patch
    regex: (hot)?fix(es)?[\/-]
    source-branches: ['main']

ignore:
  sha: []
merge-message-formats: {}
